# ---------------------------------------------------------------------------
# Exposition des interfaces des outils via ta Gateway (Gateway API).
# Hypothèse : la Gateway termine le HTTPS (certificat déjà en place sur son
# listener) et transmet en HTTP aux services.
#
# Le listener de la Gateway doit accepter les routes des namespaces "kargo"
# et "argo" (champ allowedRoutes du listener).
#
# ⚠️ AVANT DURCISSEMENT (cf. README) :
#   - Kargo : protégé par le compte admin (mot de passe) ;
#   - Argo Workflows : AUCUNE authentification -> toute personne qui atteint
#     cette URL peut approuver une mise en prod. Réserver à une Gateway
#     interne / un réseau restreint pendant la POC.
# ---------------------------------------------------------------------------
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: kargo
  namespace: kargo
spec:
  parentRefs:
    - name: __GATEWAY_NAME__
      namespace: __GATEWAY_NAMESPACE__
  hostnames:
    - __KARGO_HOST__
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /
      backendRefs:
        - name: kargo-api
          port: 80
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: argo-workflows
  namespace: argo
spec:
  parentRefs:
    - name: __GATEWAY_NAME__
      namespace: __GATEWAY_NAMESPACE__
  hostnames:
    - __ARGOWF_HOST__
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /
      backendRefs:
        - name: argo-workflows-server
          port: 2746
