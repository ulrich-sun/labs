# Valeurs de l'environnement "dev" (namespace excalidraw-dev).
# Surchargent charts/excalidraw/values.yaml. Tout ce qui est ici est personnalisable.
#
# ⚠️ image.tag et image.digest sont RÉÉCRITS par Kargo à chaque promotion
#    (dans la copie de travail ; le résultat est visible sur la branche stage/dev).
#    Ne pas supprimer ces deux clés : Kargo ne met à jour que des clés existantes.
image:
  repository: __EXCALIDRAW_IMAGE__
  tag: latest
  digest: ""

replicaCount: 1

httpRoute:
  enabled: false            # passer à true pour exposer via la Gateway
  hostnames:
    - excalidraw-dev.__APP_DOMAIN__

podLabels:
  env: dev
