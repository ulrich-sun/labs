# Projet Kargo = namespace dédié (excalidraw-poc) + rôles par défaut.
---
apiVersion: kargo.akuity.io/v1alpha1
kind: Project
metadata:
  name: excalidraw-poc
---
# Gouvernance au niveau PROJET (pas Stage) : un utilisateur qui peut éditer un
# Stage ne peut pas s'accorder l'auto-promotion.
apiVersion: kargo.akuity.io/v1alpha1
kind: ProjectConfig
metadata:
  name: excalidraw-poc        # même nom que le Project
  namespace: excalidraw-poc
spec:
  promotionPolicies:
    - stageSelector:
        name: dev
      autoPromotionEnabled: true      # chaque nouvelle Freight part en dev
    - stageSelector:
        name: staging
      autoPromotionEnabled: true      # dès qu'elle est vérifiée en dev
    - stageSelector:
        name: prod
      autoPromotionEnabled: false     # JAMAIS automatique
  # Fenêtre de promotion (gel des déploiements hors heures ouvrables).
  # Désactivée par défaut pour pouvoir faire la démo à toute heure :
  # décommenter pour le scénario "gel" (cf. README).
  # promotionWindows:
  #   - name: prod-heures-ouvrables
  #     kind: Allow
  #     stageSelector:
  #       name: prod
  #     rrule: FREQ=WEEKLY;BYDAY=MO,TU,WE,TH,FR
  #     dtstart: "TZID=America/Toronto:20260105T090000"
  #     dtend: "TZID=America/Toronto:20260105T170000"
