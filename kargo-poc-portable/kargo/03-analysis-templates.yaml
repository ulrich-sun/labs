# ---------------------------------------------------------------------------
# Vérification APRÈS chaque promotion (CRD Argo Rollouts, lancée par Kargo).
# Une Freight dont la vérification échoue n'est pas "vérifiée" dans ce stage :
# elle ne peut pas descendre vers le stage suivant.
# Syntaxe {{ args.x }} (Argo Rollouts), PAS ${{ }} (Kargo).
# Le Job est conforme à la PSA "restricted".
# ---------------------------------------------------------------------------
apiVersion: argoproj.io/v1alpha1
kind: AnalysisTemplate
metadata:
  name: smoke-test
  namespace: excalidraw-poc
spec:
  args:
    - name: url
  metrics:
    - name: http-200-and-content
      count: 3
      interval: 10s
      failureLimit: 0
      provider:
        job:
          spec:
            backoffLimit: 0
            ttlSecondsAfterFinished: 3600
            template:
              spec:
                restartPolicy: Never
                automountServiceAccountToken: false
                securityContext:
                  runAsNonRoot: true
                  runAsUser: 100
                  seccompProfile:
                    type: RuntimeDefault
                containers:
                  - name: curl
                    image: docker.io/curlimages/curl:8.10.1
                    securityContext:
                      allowPrivilegeEscalation: false
                      readOnlyRootFilesystem: true
                      capabilities:
                        drop: ["ALL"]
                    command: ["sh", "-c"]
                    args:
                      - |
                        set -e
                        echo "Smoke test sur {{ args.url }}"
                        curl -fsS --max-time 10 "{{ args.url }}" | grep -qi "excalidraw"
                        echo "OK : page servie et contenu attendu présent"
