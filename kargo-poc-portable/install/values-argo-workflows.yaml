# Argo Workflows (chart argo/argo-workflows).
# Rôle dans la POC : exécuter les CUSTOM STEPS et le WAIT-FOR-APPROVAL des
# promotions Kargo (fonctions réservées à Kargo sur Akuity Platform).

# Conteneurs conformes à la PSA "restricted"
controller:
  workflowNamespaces:
    - excalidraw-gates      # le contrôleur ne gère que ce namespace
  securityContext:
    runAsNonRoot: true
    readOnlyRootFilesystem: true
    allowPrivilegeEscalation: false
    capabilities:
      drop: ["ALL"]
    seccompProfile:
      type: RuntimeDefault
  # Appliqué à TOUS les pods de workflow : non-root, seccomp
  workflowDefaults:
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 8737
        runAsGroup: 8737
        seccompProfile:
          type: RuntimeDefault

# Conteneurs "init" et "wait" ajoutés par Argo à chaque pod de workflow
executor:
  securityContext:
    runAsNonRoot: true
    runAsUser: 8737
    readOnlyRootFilesystem: true
    allowPrivilegeEscalation: false
    capabilities:
      drop: ["ALL"]
    seccompProfile:
      type: RuntimeDefault

server:
  # ⚠️ POC UNIQUEMENT : UI et API sans authentification propre ; l'UI exposée
  # passe par une authentification basique Traefik (exposure/). Cible : authModes [sso] + RBAC sur le "Resume".
  authModes:
    - server
  secure: false
  securityContext:
    runAsNonRoot: true
    readOnlyRootFilesystem: false
    allowPrivilegeEscalation: false
    capabilities:
      drop: ["ALL"]
    seccompProfile:
      type: RuntimeDefault

# ServiceAccount + RBAC des pods de workflow, créés dans excalidraw-gates
workflow:
  serviceAccount:
    create: true
    name: argo-workflow
  rbac:
    create: true
