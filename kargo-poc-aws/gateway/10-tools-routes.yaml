# HTTPRoutes des interfaces d'outillage.
# ⚠️ Argo Workflows est SANS authentification (cf. install/values-argo-workflows.yaml) :
#    la protection repose sur le security group (80/443 limités à ton IP).
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: kargo
  namespace: kargo
spec:
  parentRefs:
    - name: apps
      namespace: gateway
      sectionName: http
  hostnames:
    - kargo.apps.98.90.197.103.sslip.io
  rules:
    - backendRefs:
        - name: kargo-api
          port: 80
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: argocd
  namespace: argocd
spec:
  parentRefs:
    - name: apps
      namespace: gateway
      sectionName: http
  hostnames:
    - argocd.apps.98.90.197.103.sslip.io
  rules:
    - backendRefs:
        - name: argocd-server
          port: 80
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: argo-workflows
  namespace: argo
spec:
  parentRefs:
    - name: apps
      namespace: gateway
      sectionName: http
  hostnames:
    - workflows.apps.98.90.197.103.sslip.io
  rules:
    - backendRefs:
        - name: argo-workflows-server
          port: 2746
