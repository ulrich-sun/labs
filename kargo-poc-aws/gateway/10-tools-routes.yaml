# HTTPRoutes des interfaces d'outillage.
# ⚠️ Argo Workflows est SANS authentification (cf. install/values-argo-workflows.yaml) :
#    sa route passe par une authentification basique (20-workflows-auth.yaml).
#    Kargo et Argo CD ont leur propre compte admin.
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: kargo
  namespace: kargo
spec:
  parentRefs:
    - name: apps
      namespace: gateway
      sectionName: http
  hostnames:
    - kargo.apps.54.162.203.26.sslip.io
  rules:
    - backendRefs:
        - name: kargo-api
          port: 80
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: argocd
  namespace: argocd
spec:
  parentRefs:
    - name: apps
      namespace: gateway
      sectionName: http
  hostnames:
    - argocd.apps.54.162.203.26.sslip.io
  rules:
    - backendRefs:
        - name: argocd-server
          port: 80
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: argo-workflows
  namespace: argo
spec:
  parentRefs:
    - name: apps
      namespace: gateway
      sectionName: http
  hostnames:
    - workflows.apps.54.162.203.26.sslip.io
  rules:
    - filters:
        # identifiant demandé avant l'UI (cf. 20-workflows-auth.yaml)
        - type: ExtensionRef
          extensionRef:
            group: traefik.io
            kind: Middleware
            name: workflows-auth
      backendRefs:
        - name: argo-workflows-server
          port: 2746
