# Point d'entrée HTTP unique du cluster (Gateway API, contrôleur : Traefik de k3s).
# apps.98.90.197.103.sslip.io = apps.<IP publique>.sslip.io (terraform output apps_domain) :
# sslip.io résout <n'importe quoi>.apps.<IP>.sslip.io vers <IP>, sans DNS à gérer.
# Le port 8000 est l'entrypoint "web" de Traefik, publié sur le port 80 de la VM
# par servicelb. Le security group n'ouvre 80/443 qu'aux IP autorisées.
---
apiVersion: v1
kind: Namespace
metadata:
  name: gateway
  labels:
    pod-security.kubernetes.io/enforce: restricted
---
apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: apps
  namespace: gateway
spec:
  gatewayClassName: traefik
  listeners:
    - name: http
      protocol: HTTP
      port: 8000
      hostname: "*.apps.98.90.197.103.sslip.io"
      allowedRoutes:
        namespaces:
          from: All      # chaque outil / environnement publie sa route dans son namespace
