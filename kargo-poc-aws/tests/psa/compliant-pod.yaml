# Doit être ACCEPTÉ et démarrer : même principe que le chart (sans build).
#   kubectl apply -f tests/psa/compliant-pod.yaml
#   kubectl wait -n psa-test --for=condition=Ready pod/psa-test-ok --timeout=120s
apiVersion: v1
kind: Pod
metadata:
  name: psa-test-ok
  namespace: psa-test
spec:
  automountServiceAccountToken: false
  securityContext:
    runAsNonRoot: true
    runAsUser: 101
    runAsGroup: 101
    seccompProfile:
      type: RuntimeDefault
  initContainers:
    - name: copy-static
      image: docker.io/excalidraw/excalidraw:latest
      command: ["sh", "-c", "cp -R /usr/share/nginx/html/. /static/"]
      securityContext: &sc
        allowPrivilegeEscalation: false
        readOnlyRootFilesystem: true
        capabilities:
          drop: ["ALL"]
      volumeMounts:
        - { name: static, mountPath: /static }
  containers:
    - name: web
      image: docker.io/nginxinc/nginx-unprivileged:1.27-alpine
      securityContext: *sc
      ports:
        - containerPort: 8080
      readinessProbe:
        httpGet: { path: /, port: 8080 }
      volumeMounts:
        - { name: static, mountPath: /usr/share/nginx/html, readOnly: true }
        - { name: tmp, mountPath: /tmp }
  volumes:
    - { name: static, emptyDir: {} }
    - { name: tmp, emptyDir: {} }
