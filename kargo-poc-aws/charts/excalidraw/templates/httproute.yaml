{{- if .Values.httpRoute.enabled }}
# Exposition par la Gateway API : http://<httpRoute.hostname>
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: {{ include "excalidraw.name" . }}
  labels:
    {{- include "excalidraw.labels" . | nindent 4 }}
spec:
  parentRefs:
    - name: {{ .Values.httpRoute.gateway.name }}
      namespace: {{ .Values.httpRoute.gateway.namespace }}
      sectionName: {{ .Values.httpRoute.gateway.sectionName }}
  hostnames:
    - {{ required "httpRoute.hostname est obligatoire" .Values.httpRoute.hostname | quote }}
  rules:
    - backendRefs:
        - name: {{ include "excalidraw.name" . }}
          port: {{ .Values.service.port }}
{{- end }}
